# Application
spring.application.name=StockSim

# H2 Database (default dev profile)
spring.datasource.url=jdbc:h2:file:./data/stocksim
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Alpha Vantage API
alphavantage.api-key=FDI392BFlS3
alphavantage.base-url=https://www.alphavantage.co/query

# Data import paths (for initial data load from legacy files)
stocksim.import.stock-dir=StockInfo
stocksim.import.portfolio-dir=PortfolioInfo
